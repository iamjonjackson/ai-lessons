 "least privilege":"Giving an identity only the minimum permissions required for its specific task, for only as long as needed.",
 "prompt injection":"Untrusted instructions embedded in content that influence a model away from its intended task.",
 "defence in depth":"Independent, overlapping safeguards so one control’s failure does not become a total failure.",

const highlightedBookExcerpts={
 chapter1:["In computer science, and especially in security, we rarely solve entirely new problems. Instead, we build on well established math, programming paradigms, and mental models to understand emerging technologies. Security in particular is a discipline shaped by history and accumulated lessons. To paraphrase what Thedore Roosevelt famously said, the more you know about the past, the better prepared you are for the future. Classes of vulnerabilities have emerged and been mitigated over time, from memory corruption to injection attacks, depending on the technologies and implementations. The development of such attacks and solutions has led to some longstanding security principles that can be applied when looking at new systems. Concepts such as least privilege, input validation, and defense in depth were not created for any single technology; they are security abstractions that apply across generations of systems. By reusing these mental models, we can more effectively reason about new architectures, including modern AI systems, and anticipate where they may fail. Sometimes a simple implementation trick is all it takes to solve a decade long vulnerability. Throughout this book we will see that many modern security problems can be reframed as traditional security challenges with well-understood solutions.", "I want to introduce a mental model we will use throughout this book for reasoning about agentic systems in production: Behaviour, Identity, Controls, and Observability, or BICO. When looking at an AI system, this mental model gives us a surprisingly effective way to pull apart what the system is supposed to do from what it is actually capable of doing, while preserving enough evidence to understand what happened afterward. Concepts like identity and observability also help us trace an agent’s actions throughout its lifecycle and understand their downstream effects.", "Behaviour is what the system wants to do. It is the intended responses or actions of the model. The prompts, instructions, objectives, training, plans, and other mechanisms that influence how the system normally acts and shape its behaviour. In traditional software we might think about this as program logic, but with AI systems that logic is probabilistic. Behaviour can be directed through prompts, fine-tuning, guardrails, evaluations, and other alignment techniques, but it should never be confused with a hard security boundary. If our security model depends entirely on the AI deciding to behave itself, we don’t really have a security model. To that end we think the saying “security through text, fails under stress” is helpful for remembering that prompts alone aren’t enough to curb a model’s actions. Chapter 2 goes much deeper on how behaviour guides the model’s response.", "Identity establishes who or what is acting, what it is allowed to do, and, in agentic systems, on whose behalf it is acting. We use Identity here in the broader IAM sense, consisting of three related components: Authentication (AuthN), Authorization (AuthZ), and Delegation. Authentication establishes “who” the actor is (note this actor or user can be an agent). Authorization determines what that identity is permitted to access or perform. Delegation establishes whose authority is being exercised when one user, service, or agent acts through another system. Delegation may be a multi-step chain or root user depending on the actor, but this is essentially the trust chain. This is a critical attribute for agents because the identity of the agent, the identity of the calling user, and the permissions delegated between them may all be different. Identity therefore gives the environment the security context in which the system operates. Who is this? What may it do? On whose behalf is it doing it? The answers to these questions are all key factors in making security decisions on actions within the environment.", "Controls are the hard technical restrictions that exist within the environment that constrain the system from acting in unexpected ways. Controls should exist outside the model’s own decision-making influence and independently constrain what is possible. Filesystem permissions, network egress restrictions, API gateways, sandboxing, rate limits, approval workflows, scoped tools, transaction limits, and policy validation are all examples. A prompt saying don’t send data to the Internet is behaviour. A network policy preventing the process from reaching the Internet is a control. This book will show how to use effective controls and not behaviour to secure agentic systems.", "Observability is the evidence that lets us reconstruct an agent’s actions after, and increasingly while, they happen. Recording model prompts and responses is not enough; once an agent crosses into tools and external systems, the useful trace has to follow it through work delegation, authorization decisions, API calls, network requests, sub-agent creation, approvals, control decisions, and resource modifications. This will likely require collecting signals or logs from multiple services in a single location, typically with a SIEM, or Security Information and Event Management tool (which we will cover more of in chapter 4!). A useful trace should answer more than “what did the model say?” It should tell us what activity happened, which workload it was associated with, who started that workload, which agent identity performed each action, which policy permitted or denied the activity, what target resources were affected, and when those actions occurred. Observability provides evidence that a tool or control was invoked, what decision it made, and what happened around that decision. A transaction limit may stop an agent from transferring $100,000; observability tells us which session attempted it, which identity called the payment service, whose delegated authority it carried, which policy rejected it, what the agent did next, and hopefully where it all went wrong. This becomes especially important when autonomous systems create long chains of causality: a human launches an agent, the agent launches a sub-agent, the sub-agent calls a tool, and the tool requests an API that changes a resource. Without end-to-end observability, those events become disconnected log lines; with it, they become a single trace that can be associated with the workload, identities, control decisions, and, where appropriate, the agent’s reasoning.", "These layers should reinforce each other. It’s a useful mental model for how to design an agentic system that has reliable controls. Another useful way to remember this mental model is “Security is behaviour anchored in identity, bounded by controls, and made traceable through observability”. When behaviour fails, identity should be helpful in attributing that failure, and controls should limit the damage that identity can produce. Observability should tell us what actually happened, which controls were invoked, and how the effects propagated through the system. AI systems are probabilistic, so occasionally behaviour will fail. Our job as security engineers is to make sure that failure doesn’t automatically become an incident, when something does go wrong, that we have enough evidence to understand exactly what happened.", "One of the core principles of LLMs or AI systems in general, is that they have probabilistic outcomes; they are non-deterministic systems. This means that given the same exact input, LLMs will often produce two slightly different outputs, and this is a desirable feature of this technology. At their core, large language models (LLMs) don’t always return the same answer, and there are numerous mathematical reasons for this (see \"Defeating Nondeterminism in LLM Inference“). From sampling the tokens, to floating point math, and concurrent associations, there are multiple places where non-determinism is consciously implemented in the design of the system. Chapter 2 goes heavily into these ideas, both the none-determinism of the models as well as how to steer some of that behaviour.", "The prompt is really just a guiding mechanism for the program execution, it shouldn’t be the security boundary or enforce permissions. I’ll repeat that for emphasis: the prompt is not a security boundary and should not be treated as a decider for access controls. While prompts and plans can describe the intended constraints and outcomes, they can’t guarantee adherence as we’ve already seen. They are simply a behaviour guide. In this sense, “security through prompt conditions” is analogous to “security through obscurity”, in that it provides a false sense of control without real enforcement. This is a good time to recall our previous slogan, “security through text, fails under stress”. The prompts certainly guide the behaviour, but ultimately the system must be engineered to enforce and support the permissions of the program. Therefore the true security controls will be implemented outside the prompts, such as programmatic checks, filesystem permissions, network controls, and scoped API access, which will ultimately determine what the program is capable of doing beyond its intended prompt instructions.", "Prompts to LLMs can function in a similar way that source code does to an executable program. Granted, it’s not a 1:1 as models cover a distribution vs a program’s deterministic output, but it still gives us insight into the input (code) that eventually results in output (executable program). It allows us to view the intents, model reasoning, and control flow in an easily interpretable way rather than trying to understand it through the output alone. Similar to infrastructure-as-code, storing and refining prompts provides us a semi-reproducible and inspectable way into guiding system behavior, enabling refinement, and the ability to save highly effective parts of our prompts over time. The ability to version, trace, and iterate on prompts is crucial for debugging as we evolve our program over time. It will enable us to be more scientific with these systems over time and agentic systems also tend to function better when the prompts are fully detailed instructions with context as opposed to one-line prompts.", "Context windows define the working memory of LLM systems, but their effectiveness is determined less by sheer size than by structure and relevance. Modern models may support extremely large context windows, yet increasing context size does not automatically increase the quality of the output. Most daily use of frontier models doesn’t even come close to using the full context window anyway. In practice, very large contexts often become noisy and inefficient unless the information being fed to them is carefully organized. Research on long-context performance has repeatedly shown that models do not use every part of a large prompt equally well; relevant information can become harder to retrieve or apply when it is buried in the middle of long inputs or when it is surrounded by less relevant tokens.", "One of the modern techniques for adding structure to the context is using files to externalize intent and execution. A simple plan.md does several jobs at once: it compresses intent, structures other information, filters noise, adds phases for human-in-the-loop interaction, and acts as a stable anchor in context. Instead of forcing the model to infer the goal again and again from a long conversational trail, you give it a durable artifact that states what the task is, what has already been done, and what remains. As the working context fills up, the model can return to that file to refresh its orientation instead of drifting away from the original objective. This is often far more reliable than hoping the entire conversational history remains equally salient. The same principle applies to extra functionality, summaries, rewritten plans, and execution logs. Compartmentalization, recall, and summarization are often treated as token-saving tricks but they are more fundamental than that. Summarization is one of the main ways LLM systems simulate continuity within an inherently stateless architecture. Summary objects are so powerful because they both shorten context (cost savings) and notating the parts that matter by constantly updating some type of memory structure. Summarizing hits many bullet points for us, it’s logging, it’s optimization, and it’s improved memory management. That said, if the summarization is rewriting the same file, consider saving a copy or backup for a historical reference.", "When working with AI-assisted development, the principle of verify before trust becomes essential. AI systems can accelerate coding dramatically, but they can also introduce subtle bugs, insecure patterns, or outright hallucinations in the generated code. In practice, this means that every piece of AI-generated code should be treated as untrusted until reviewed by a human developer. I’ve taken to making a very explicit distinction between AI generated code (unreviewed code), and AI assisted code (AI generated code that a human has reviewed and/or edited), when discussing the two. Code reviews should remain a mandatory step in the development process, just as they are in traditional software engineering. Further, pushing un-reviewed, AI-generated code on peers or into a pull request, should be considered an anti-pattern or faux pas. That is to say, humans and especially engineers should be producing AI assisted code whenever possible, and should actively advise colleagues against purely AI-generated code. I find that AI generated code, if left unchecked, becomes increasingly hard for humans to contribute to over time. Engineers should take great care in setting up any initial structure, harnesses, and test suites for code that will be heavily AI assisted. In this way, engineers can add structure and guardrails (in the form of linting, unit, smoke, integration, and systems tests), to help ensure AI assisted code confirms to the standards of the project.", "Human-in-the-loop controls are particularly valuable when agents interact with sensitive systems or high-impact operations. For example, an agent that drafts an email may not require approval, but an agent that modifies a production database, deploys code, accesses confidential records, exploits a live system, or sends external communications should typically require human validation before executing those actions. By defining clear thresholds for when human review is required, in policy, a markdown document, or tiered agent controls, applications can balance the efficiency benefits of automation with the safety provided by human judgment. This can be made even more effective by writing your own tools that gate the actions or call the model on behalf of the user, moving away from generic agent harness towards specific tools.", "Another effective pattern is tiered autonomy, where agents are allowed to operate independently for low-risk tasks but must escalate higher-risk decisions to a human reviewer. This model treats human oversight as a governance layer rather than a constant bottleneck. The agent can still accelerate low-risk workflows, but the system ensures that potentially dangerous or irreversible actions are examined by a person who can recognize context, intent, and broader consequences that automated systems might miss. Human-in-the-loop processes can also serve as a learning mechanism. When humans review agent actions, approving, rejecting, or modifying them, the organization gains valuable insight into where the agent performs well and where it struggles. Over time, these human feedback loops can inform improvements to prompts, guardrails, policies, and system design. In this sense, human oversight is not just a safety measure; it is also a practical way to continuously refine the reliability and security of agentic systems.", "There are also many lessons we can borrow directly from the microservice world. Alongside the Principle of Least Privilege, we have a guiding sister principle: Separation of Duties. This aligns well with the Linux philosophy of small, purpose-built tools. Smaller, more focused agents and tools are easier to give a clear identity, assign narrowly scoped authority, test independently, and constrain with least privilege. If a tool needs to take on another major duty, it may be better to separate that responsibility into another tool and explicitly manage the permissions and trust boundary between them. Not only does this enforce compartmentalization, it also helps keep the blast radius of failures or vulnerabilities smaller.", "This leads to a practical approach: start locked down, then open up the controls you want individually.", "One example is from the “ALARA for Agents” paper. ALARA stands for As Low as Reasonably Achievable. The idea emphasizes that projects should define their tool scope, context, and permissions explicitly within a structured project definition. The key difference from current agent approaches (like SKILLS from Anthropic, which uses mostly free-form markdown) is that ALARA enforces structure for agents.", "Their results show that structuring agent systems through strict tool scoping and modular organization improves performance, especially for smaller models. Adding structured overhead also reduces failure modes like context overload and coordination breakdowns by giving agents stable anchors (files and structure) to return to as context grows. The study further shows that limiting tool access improves both accuracy and safety by decomposing agents into specialized roles with minimal context. This structured approach actually improves scalability and collaboration between agents, as opposed to trying to make megalithic agents. The ALARA structure is pretty based (great) in terms of concepts and models for laying out an AI project, if not practically at least conceptually. Let’s look at an overview of the structure below:", "This attacker mindset closely aligns with the long-standing security practice of threat modeling. At its core, threat modeling is an exercise in playing devil’s advocate with your own work. Rather than assuming a system will behave as intended, you deliberately ask how it could go wrong. What assumptions could fail? What unintended behaviors might emerge? By challenging your own design decisions in this way, you begin to surface the weaknesses that an adversary might eventually discover. It can also help to bring an outsider in for this type of analysis, we often have unconscious biases with our own work that others will not have.", "Once potential threats are identified, the next step is to evaluate them in terms of likelihood and impact. This process is often called risk analysis and comes from the field of actuarial sciences. Their formula for calculating risk is [Risk = Impact x Liklihood]. Some scenarios may be highly unlikely but catastrophic if they occur, while others may be frequent but relatively minor. By considering both the probability of an event and the severity of its consequences, you can begin to estimate the risk each scenario presents. This process allows teams to prioritize their efforts, focusing first on the risks that pose the greatest danger to the system or the organization. If this seems completely foreign, there is a fantastic book on this subject called How to Measure Anything in Cybersecurity Risk by Douglas Hubbard that shows exactly how to quantify these metrics.", "You should also consider failure modes that have nothing to do with attackers at all, systems can fail through design flaws, operational mistakes, or unexpected interactions with other components. While malicious attackers open up a plethora of new outcomes, your most common scenarios will likely be through regular use. As an engineer you shouldn’t rely on a platform or another team to handle your failure cases for you. Do rigorous red teaming of your own solutions to weed out any issues before another team sees them or worst case, they turn into an incident.", "As a shortcut to normal red teaming, some people have started calling a certain mix of properties and access the Lethal Trifecta or a recipe for a security incident in the making. The Lethal Trifecta was first coined by Simon Willison, where he proposes tools or agents with the following characteristics can be easily manipulated by external threats to access your private data. While not every system that exhibits these traits will inevitably lead to compromise, the framework provides a useful mental model for evaluating risk in agentic systems. The trifecta describes a situation in which an AI system simultaneously has access to private or sensitive data, is exposed to untrusted or attacker-controlled content, and possesses the ability to communicate externally in ways that could transmit that data outside the system. When these three conditions coexist, an attacker may be able to manipulate the model through crafted inputs and ultimately extract sensitive information.", "Untrusted input is a fundamental issue in computer and web security. At its most basic, if we have users, they can submit maliciously crafted input to attack the system, and we will otherwise refer to this category of problems as untrusted input. Even if you completely trust your user base, user accounts can be hijacked (through techniques such as credential phishing), and operated in a malicious manner. It’s important to understand that this applies to all untrusted input, not just input from users, but it can be from stored data or even tool output. In agentic systems, this could be anything that the model or tool pulls in, from retrieved documents, files, memory, previous summaries, web content, emails, to agent-to-agent messages. Returning to the principle, we can see this as a core principle and best practice on sites like securecoding.org, underscoring the importance of input validation in regards to untrusted input. This principle states that if we are going to have user input, or really input of any kind, we should treat it as untrusted, or simply “never trust unvalidated input”. The key here is in validating or finding a way to trust the input stream within the context of the system. Thus we should be able to produce a principle on untrusted input. That principle can be as simple as: “Treat all external input as potentially malicious until validated within the intended context.”", "This is particularly relevant to AI systems as systems can take user prompts and this changes the output of the system. This can result in prompt injection or unexpected outcomes of a system where a user can directly influence the input of an LLM system. It’s a fundamental property of LLMs to take that text input, and if that’s taken directly from “untrusted users” then it may open up the system to a wide category of attacks.", "Access controls on security boundaries are a fundamental principle of security, which is commonly gated by properties known as authentication (AuthN) and authorization (AuthZ). Authentication is essentially your ability to prove “who” you are, established through what you know (passwords), what you own (keys), or even biometrics. Whereas Authorization is what you have permissions to access with that identity. As a shorthand, and a good mnemonic for remembering them, people often call Authentication, AuthN, and they call Authorization AuthZ. Both of these features together make up what we have come to call Identity within the context of Behaviour, Identity, Controls, and Observability (BICO). At the core of BICO we need to establish what is the intended behaviour and what is the system’s core identity, then we can design access controls for systems such that we can limit permissions to the intended permissions. Thus, we can produce another principle of information security, rooted in zero trust architecture: “Access decisions should require verified identity and explicit authorization before actions are permitted.”", "As we transition this to information security, we can apply this as a principle of control decay: “Security controls lose effectiveness over time unless continuously tested, updated, and challenged.” In applying that to the above example, the right move would have been to deconstruct the ever-expanding network firewall rule, into specific service or host roles, making each one tight and explicit to the service it is controlling. One of the reasons we lay this principle out is a lot of automation work tends to be set-and-forget, but time has shown that all things decay, even technology. This principle tends to serve as a good basis for the next principle, which is layering controls to counter when an individual control may fail.", "As we’ve previously seen, control decay is real and controls can and will fail spontaneously over time. Sometimes even security controls themselves can have vulnerabilities or bypasses in the underlying technologies. This persistent issue of control failure means we should be prepared for control failure, and one solution for such a scenario is to have overlapping controls. Thus we can produce an infosec principle on this phenomenon such as: “Security improves when independent controls overlap such that failure of one does not produce a total failure of the control set.” And that is really the crux of Defense in Depth.", "Essentially, the Principle of Least Privilege tells us that each part of the system should have the minimum permissions necessary to perform its task, and no more permissions than that.", "There has been such a rise in hallucinated dependency names by model systems, that attackers have begun typo squatting such packages, and essentially typosquating software that was AI hallucinated. Traditional cybersquating or typosquatting relied on developers mistyping trusted package names. This new type of attack, coined as Slopsquatting instead weaponizes hallucinated dependencies. This is obviously a funny play on the term slopcode, which is what many people have come to call purely AI generated code.", "I like to think of computer systems like wandering a series of dark rooms, or even a series of connected buildings. In these buildings there are tons of boxes of information, but you need access to the rooms and a light to look through all of the boxes. For whatever reason, I tend to think of network scanning and searching file systems like that, albeit at scale and using lots of automation. Likewise if we are defending these systems we will want to wire them up such that we know what is going on inside of them. We want to know if there is someone sneaking around, or if one of the buildings has caught fire. This is only possible if we are able to observe them remotely, and thus we reach the crux of this principle: observation. Our principle of observation will state: “You cannot secure behaviors you cannot observe. Systems require sufficient telemetry to distinguish intended behavior from anomalous behavior.”", "When a system fails, how does it fail? It should fail in a way that does not allow for more permissions or result in unexpected behaviour. In security we call this failing closed or failing securely. This is another classic control that we can blatantly steal from Bruce Schnier’s “The Process of Security”. This idea of failing securely is more important than ever in agentic or LLM systems, as these systems can easily chew through funds (tokens or energy) when they enter a looping failure state. If you’ve worked with agents in any capacity you’ve probably seen them rabbit hole on a problem, and spin their wheels endlessly trying to solve an impossible task.", "As defined by National Institute of Standards and Technology in NIST SP 800-53, Planning is itself an entire security control family. That decision isn’t made lightly, I can’t tell you how many bad decisions or vulnerabilities my teams have removed in the planning stage. Planning before diving into any kind of prompting or agent tasks, will almost always yield greater results and a more high quality product. By planning we mean setting up a formal project structure, outline, and goals, at development milestones.", "As analysis becomes faster and increasingly automated, plans should not allow accountability to become automated with it. Models can help analyze systems, identify risks, and propose controls, but they should not be responsible for the consequences of a decision. Every plan should therefore have a named, accountable individual who is responsible for reviewing the evidence, making or approving the relevant judgment, driving the implementation, accepting any residual risk, and ensuring unresolved gaps have owners and deadlines. Automation can reduce the effort required to reach a decision; it does not remove the need for a person who is responsible for a decision and the plan is an excellent place to nail that accountability down. There is an article by Drel that presents this idea of accountability along with planning in security design reviews, as they predict both of these activities becoming increasingly automated with LLMs (plan generation and security reviews of plans).", "We started by revisiting the fundamentals as both a history lesson and to prepare the reader with a mental toolkit. Traditional information security issues such as untrusted input, access controls, defense in depth, logging, and secure failure design are still effective concepts we can apply to modern agentic systems. The reason problem-sets like broken access controls have sat at or near the top of OWASP’s vulnerability list for over two decades is because these are ubiquitous security problems across new technologies. Granted, there are a lot of genuinely new and interesting problems in this new technology space. The probabilistic nature of these systems isn’t a bug to be patched, it’s intentionally designed in, and it breaks a lot of assumptions that traditional software engineering is built on.", "Querying LLMs isn’t the same thing as making a traditional function call. You’re not invoking logic, you’re querying a statistical and dynamic distribution. Not only that, but that distribution can be manipulated at multiple parts in its supply chain. From there we took a look at prompt management as a logging and summarization effort. This was insightful in terms of how context windows behave under pressure, and where the real security failures happen when agents start touching the world. We talk about saving your prompts like source code, because they are, they’re your original intent and the most immediate interpretation of that by the LLM. Treating them as throwaway chat history is a mistake that’ll haunt you later in debugging and incident response. We dug into context windows and memory architecture, where the lesson is also clear: more context isn’t always better context. Structure beats size every time."],
 chapter2:["Alignment operates at a specific layer of the system. It shapes the model’s behavior during training and fine-tuning. AI security, on the other hand, operates at the systems layer and governs what the model is allowed to access and execute once deployed. There is overlap, specifically as models are being used more frequently in cybersecurity domains, but the goals and enforcement mechanisms are different. Alignment influences model behavior, while security constrains identity and control.", "Agents can be on their best behavior, fully following alignment protocols and not impacting a signal content policy violation to create a real world impact. Agentic workflows grant a model access to tools, memory, and the ability to take sequential action towards a real world goal. The models reason across steps, make decisions, and then take action. Which is exactly where the problem emerges.", "Alignment can influence whether a model proposes an action, but it does not determine whether that action is carried out. In isolation, alignment looks like control, but the system actually decides what happens on disk, over the network, or across your infrastructure. Control requires deterministic enforcement, and that lives in the surrounding system. The moment a model is given access to tools, data, or execution environments, the problem shifts from behavior to authority."]

const slidePoints={
 "The central distinction":["Alignment changes likely model behaviour, not the permissions around it.","Security governs what the deployed system may access or execute.","Deterministic enforcement belongs in the surrounding system."],
 "A security lens built from history":["Identity and observability help trace an agent’s actions and downstream effects.","Controls should constrain capability independently of model decision-making.","Established security principles remain useful across new implementations."],

 "Verify before trust":["Treat generated code as untrusted until a human reviews it.","Use small changes, branches, tests, linting, and dependency checks.","A staged review process makes errors easier to detect before release."],

const slides=[
 {type:"intro",title:"AI Security<br>and Alignment",text:"An interactive lesson on shaping model behaviour, limiting real-world authority, and building agentic systems that can withstand failure.",note:"Based on Chapters 1–2 of <em>Securing AI Systems</em> by Dan Borges and Campbell, in early release when this lesson was produced."},
 {title:"How to use this lesson",text:"Move through 50 short, full-page slides. Tap dotted terms for definitions. Open “From the book” for brief source excerpts and context. Knowledge checks are distributed through the lesson.",cards:[["Aim","Connect AI alignment vocabulary to practical security controls."],["Mindset","Assume models sometimes deviate; make the damage bounded and traceable."],["Outcome","Connect model behaviour to practical security controls."]]},
 {title:"The central distinction",text:"<strong>Alignment influences generation. Systems govern execution.</strong> A model can be polite, helpful, and well-aligned while the surrounding application still gives it unsafe authority.",quote:"“Alignment influences model behaviour, while security constrains identity and control.”",more:"Alignment operates at a specific layer: it shapes behaviour during training and fine-tuning. AI security operates at the systems layer, governing what the model may access and execute after deployment."},
 {title:"Why this matters now",text:"Agentic systems do more than answer questions. They retrieve documents, invoke APIs, write files, create sub-agents, and alter production resources. That moves risk from text into the environment.",cards:[["Model behaviour","Probabilistic and sometimes surprising."],["Tool use","Can create durable external effects."],["Security engineering","Must make unsafe effects impossible or difficult."]]},
 {title:"A security lens built from history",text:"AI changes implementation details, but many underlying problems are familiar: untrusted input, excess privilege, weak boundaries, missing logs, and single points of failure.",more:"The book frames traditional principles such as least privilege, input validation, and defence in depth as durable abstractions that apply across generations of technology."},
 q("Knowledge check 1: Which statement best captures the relationship between alignment and security?",["Alignment replaces access control whenever a model refuses bad requests.","Alignment shapes likely outputs; security enforces permitted actions.","Security only matters for models that are not aligned.","Alignment is the same thing as authentication."],1,"Alignment changes probabilities. Identity, permissions, policy checks, and controls determine what can actually occur."),
 {title:"Meet BICO",text:"A production-agent mental model: <strong>Behaviour, Identity, Controls, and Observability.</strong> It separates what the system is meant to do from what it is actually permitted to do—and preserves evidence.",bico:true},
 {title:"B: Behaviour",text:"Behaviour is the intended response or action: prompts, plans, training, fine-tuning, guardrails, and evaluations. It is useful guidance—but never a hard boundary.",quote:"“Security through text, fails under stress.”",more:"The source is explicit: if a security model depends entirely on the AI deciding to behave itself, it is not truly a security model."},
 {title:"I: Identity",text:"Identity answers: <strong>Who is acting? What may it do? On whose behalf?</strong> In agentic systems, the agent, calling user, service, and delegated authority may all differ.",flow:["Authentication (AuthN)","Authorisation (AuthZ)","Delegation","Action"]},
 {title:"C: Controls",text:"Controls are technical restrictions outside the model’s decision-making influence. They constrain what is possible even when behaviour goes wrong.",cards:[["Behaviour","“Do not send data to the Internet.”"],["Control","A network policy prevents the process from reaching the Internet."],["Design test","Could the model bypass this using only its own output? If yes, it is not a sufficient control."]]},
 {title:"O: Observability",text:"Logs must follow an action beyond model text: delegation, authorisation, tools, policy decisions, APIs, resources, and effects. A SIEM can correlate this evidence.",more:"A useful trace shows the workload, initiating user, agent identity, delegated authority, policy decision, target resources, and time—not only what the model said."},
 q("Knowledge check 2: A prompt tells an agent not to upload a report. Which addition is a control?",["A stronger version of the same prompt","A model evaluation that rewards refusals","A network policy blocks the upload destination.","A dashboard showing whether the upload actually happened"],2,"The network policy constrains capability independently of the model. The dashboard is observability, and the others shape behaviour."),
 {title:"BICO as a failure plan",text:"When behaviour fails, identity should attribute the failure, controls should limit impact, and observability should show what occurred. The aim is not perfect model behaviour; it is bounded failure.",quote:"“Security is behaviour anchored in identity, bounded by controls, and made traceable through observability.”"},
 {title:"Probabilistic by design",text:"LLMs are not deterministic functions. Identical input can yield different outputs because of sampling, floating-point effects, and other inference behaviour. Build determinism around the model.",cards:[["Do not assume","A passing test proves all future behaviour."],["Do enforce","Deterministic checks at the action boundary."],["Do expect","Some variance in reasoning and output."]]},
 {title:"The prompt is not a permission system",text:"Prompts can document intent and guide a model, much like source material guides a program. They cannot reliably authorize an action, revoke a credential, or enforce a boundary.",more:"The source compares relying on prompt conditions to security through obscurity: both can create a false sense of enforcement when no hard control exists."},
 {title:"Prompt traceability is still valuable",text:"Version prompts and plans like source code. Trace them to sessions, outputs, and changes. This supports debugging, reproducibility, incident response, and accountability—but protect the trace itself.",cards:[["Store","Prompts, plans, model configuration, and key outputs."],["Review","Prompt libraries and shared skills as supply-chain artifacts."],["Protect","Secrets and sensitive context must not leak into logs."]]},
 q("Knowledge check 3: Why should a reusable prompt library be reviewed like a software supply-chain component?",["Prompts make models deterministic.","Prompts can carry unsafe instructions into connected systems.","Prompt files always contain executable binaries and deployment scripts.","Reviewing prompts eliminates prompt injection risks."],1,"Prompts are interpreted input that can influence connected tools and workflows. Review reduces risk; it does not turn them into a security boundary."),
 {title:"Context is working memory—not a vault",text:"Bigger context windows do not automatically yield better reasoning. Important instructions can be buried in noisy, long inputs. Structure and relevance matter more than raw size.",cards:[["Curate","Use only task-relevant context."],["Externalize","Keep a durable, reviewable plan or memory artifact."],["Summarize","Record verified work, assumptions, failures, and next steps."]]},
 {title:"Artifact-driven workflows",text:"A plan, execution log, and reviewed summaries give an agent stable anchors. They also create natural human checkpoints and a recoverable handoff between stages or agents.",more:"The chapter describes summaries as a way to simulate continuity in an inherently stateless architecture, while preserving a reviewable record of what mattered."},
 {title:"Verify before trust",text:"Treat AI-generated code as untrusted until a human reviews it. Keep changes small, use branches, and make tests, linting, dependency checks, and secrets detection part of the harness.",quote:"AI-assisted code is AI-generated code that a human has reviewed and/or edited.",more:"The book advocates a staged, plan-driven approach: approve an architecture, introduce small features, and review each branch before it lands."},
 q("Knowledge check 4: Which setup best preserves independence between AI-generated implementation and validation?",["Have the same agent generate both code and tests in its working directory.","Run independently reviewed tests outside the agent’s control.","Ask the model to promise it did not alter the tests.","Only run tests after a production deployment."],1,"Independent tests and an out-of-band CI boundary make it harder for an agent to optimise the validator rather than the intended behaviour."),
 {title:"Human-in-the-loop (HITL)",text:"Human review is a runtime control when an agent’s action is high impact or irreversible. It is not merely a speed bump: it is an approval boundary with an accountable decision-maker.",cards:[["Usually low risk","Drafting a private summary."],["Often high risk","Database change, deployment, external send, confidential record access."],["Escalate","Based on impact, irreversibility, data sensitivity, and authority."]]},
 {title:"Tiered autonomy",text:"Allow independent operation for bounded, low-risk work. Require approval for higher-risk actions. This preserves automation where it helps without normalizing broad, standing authority.",more:"Human feedback improves prompts, policies, and controls over time. That makes HITL both a safeguard and a learning loop."},
 {title:"Tool use changes the problem",text:"A model’s natural-language answer is one thing. An agent that can call a shell, payment API, production database, or outbound email system is operating with authority.",quote:"“The problem shifts from behaviour to authority.”"},
 {title:"Separation of duties",text:"Make the agentic component focused and narrow. Small purpose-built agents and tools are easier to identity-map, test, scope, and constrain. Split major duties across explicit boundaries.",flow:["Research agent","Reviewed result","Scoped execution tool","Audited change"]},
 q("Knowledge check 5: What is the primary security benefit of separating a broad agent into focused tools?",["It guarantees the model will not hallucinate.","It reduces blast radius and narrows permissions.","It removes the need to log actions.","It lets every tool share one powerful credential."],1,"Focused components allow narrow identities, scoped authority, independent tests, and clearer trust boundaries."),
 {title:"Start locked down, then pivot",text:"Begin with default-deny. Enable each capability deliberately as the system proves it needs it. This makes permission growth visible and forces an explicit design decision.",flow:["Default deny","Incremental enablement","Continuous audit"]},
 {title:"ALARA: structured agents",text:"The chapter introduces <strong>As Low as Reasonably Achievable</strong> as a project structure that explicitly scopes context, agents, tools, workflows, data, and model configuration.",cards:[["Context files","Guide intended behaviour."],["Agent definitions","Give each role clear responsibilities."],["Tool definitions","Make allowable actions explicit."],["Workflows","Separate orchestration from execution."]]},
 {title:"What structured scoping buys you",text:"Strict tool scoping and modular roles can improve safety <em>and</em> performance. Fewer irrelevant tools and less context reduce overload, coordination breakdowns, and accidental capability.",more:"The cited ALARA evaluation reports improvements across local-model tasks when agents use structured organisation, minimal context, and tighter tool access."},
 {title:"Threat modelling: play devil’s advocate",text:"Assume a system can fail or be abused. Ask how an attacker, a confused user, a compromised account, an unavailable service, or an unexpected interaction could change outcomes.",cards:[["Assets","What data, money, systems, and trust matter?"],["Actors","Who could influence or misuse the system?"],["Paths","Where does input enter, authority change, or data leave?"],["Impact","What happens if each path succeeds?"]]},
 q("Knowledge check 6: Which question belongs earliest in a threat-modelling exercise?",["Which model vendor has the most marketing material this year?","How might an attacker or confused user change the workflow?","How can we remove all logs to reduce storage cost?","How can we grant the agent administrator rights faster than planned?"],1,"Threat modelling begins by challenging assumptions and exploring unintended paths, not by assuming intended behaviour."),
 {title:"Risk needs two dimensions",text:"A practical starting point is <strong>risk = impact × likelihood.</strong> An unlikely catastrophe and a common nuisance may both deserve attention—but for different reasons.",cards:[["Likelihood","How plausible is the event in this deployment?"],["Impact","What would it cost: data, money, safety, availability, trust?"],["Prioritize","Address material combinations first; document residual risk."]]},
 {title:"Red team before attackers do",text:"Red teaming exercises prompts, tools, policies, and workflows against plausible misuse. A tabletop exercise can expose gaps in communication, controls, logs, and incident response without a live incident.",more:"The source emphasises both malicious and non-malicious failures: design defects, operational mistakes, and unexpected component interactions often produce the most common scenarios."},
 {title:"The Lethal Trifecta",text:"A useful shortcut for agent risk. Elevated concern appears when all three conditions coexist:",cards:[["1. Private data","The agent can retrieve sensitive information."],["2. Untrusted input","Attacker-controlled content reaches the model."],["3. External communication","The system can transmit information beyond its boundary."]],more:"Simon Willison’s Lethal Trifecta is a threat-modelling heuristic, not a claim that every such system is inevitably compromised."},
 q("Knowledge check 7: Which change most directly breaks the Lethal Trifecta for a document-reading agent?",["Give it a more persuasive and carefully worded system prompt.","Gate its ability to send retrieved data externally.","Increase the context window.","Ask users to be trustworthy."],1,"Removing or strongly gating an exfiltration path eliminates one of the three preconditions. You should still address the other risks."),
 {title:"Untrusted input is everywhere",text:"Treat external input as potentially malicious until validated in context. For agents, that includes files, web pages, retrieved documents, emails, memory, summaries, tool output, and agent-to-agent messages.",quote:"“Treat all external input as potentially malicious until validated within the intended context.”"},
 {title:"Prompt injection is a systems problem",text:"Injection is not solved simply by asking the model to ignore malicious text. Instead, isolate model reasoning from execution and use deterministic controls around actions the model proposes.",flow:["Untrusted content","Model interpretation","Proposed action","Policy validation","Scoped tool execution"]},
 {title:"Access controls at boundaries",text:"Every crossing where assumptions change is a <strong>trust boundary</strong>: user to service, service to API, agent to tool, environment to network, or one delegated identity to another. Verify identity and authorisation at each one.",more:"The book’s principle: “Access decisions should require verified identity and explicit authorisation before actions are permitted.”"},
 q("Knowledge check 8: An agent calls a payroll API on behalf of an employee. What should the service verify?",["Only that the model produced grammatically correct JSON.","Verify agent identity, delegation, and authorisation.","That the agent’s system prompt says it is trustworthy.","Only the employee’s network location."],1,"Identity and delegation establish who is acting and on whose authority; authorisation determines whether that action is allowed."),
 {title:"Control decay is real",text:"Controls weaken as exceptions accumulate, integrations change, and teams modify old rules. A firewall can still exist while becoming broadly permissive. Controls require recurring tests and redesign.",quote:"“Security controls lose effectiveness over time unless continuously tested, updated, and challenged.”"},
 {title:"Defence in depth",text:"Assume one control will fail. Layer independent safeguards so a failure in prompts, policy, identity, network, approval, or detection does not create total compromise.",cards:[["Prevent","Least privilege, sandboxing, allow-lists."],["Constrain","Transaction limits, scoped tools, egress controls."],["Detect","Correlated logs and anomaly monitoring."],["Respond","Revocation, approval, rollback, incident playbooks."]]},
 {title:"Least privilege for agents",text:"Give every component the smallest authority necessary for a specific task and duration. Prefer task-scoped, short-lived credentials over a standing administrator token in context.",more:"The chapter connects over-privileged agents to oversized attack surfaces, wider error impact, and privilege escalation—especially troubling for probabilistic systems."},
 q("Knowledge check 9: Which credential design follows least privilege?",["One permanent production-admin key shared by every agent.","A short-lived token for one approved record update.","A hidden token in the system prompt.","A token with every permission except one dangerous API."],1,"The narrow, short-lived token limits both what an agent can do and the duration of a possible misuse."),
 {title:"Supply-chain risk includes AI output",text:"Models can hallucinate dependency names. Attackers can register those names and catch automated installations—an emerging pattern called <strong>slopsquatting</strong>. Treat generated dependencies as untrusted suggestions.",cards:[["Verify","Names, publishers, versions, licences, and integrity."],["Scan","Dependencies, code, configurations, and secrets."],["Constrain","Use allow-lists and locked manifests where appropriate."]]},
 {title:"Monitor what you cannot control",text:"Some risks cannot be prevented immediately. Centralised, normalised telemetry lets teams detect anomalous behaviour, investigate incidents, and understand whether controls are still working.",quote:"“You cannot secure behaviours you cannot observe.”",more:"Instrumentation should record critical interactions and security functions, especially when an action crosses a security boundary."},
 {title:"Fail securely",text:"Failure is inevitable. A failure should reduce capability rather than accidentally broaden it. Design explicit degraded modes: deny, require extra verification, queue for review, or use a narrow alternate path.",cards:[["Fail open","May be correct for life safety, but can expose a security boundary."],["Fail closed","Usually safer for authorisation and sensitive action."],["Resilient design","Use a deliberate secondary path, not an accidental bypass."]]},
 q("Knowledge check 10: A policy service is unavailable just before an agent sends a customer export. What is the safest default?",["Send it anyway so the workflow remains reliable.","Retry forever with the same broad credential.","Fail closed and require review.","Ask the model whether the export is probably safe."],2,"When authorisation cannot be evaluated, capability should not silently expand. A controlled recovery path preserves both safety and operability."),
 {title:"Planning is a security control",text:"Planning clarifies architecture, trust boundaries, ownership, controls, tests, and residual risk <em>before</em> an agent has authority. It is a NIST SP 800-53 control family for a reason.",cards:[["Name an owner","A person accepts decisions and residual risk."],["Design boundaries","Map identity, data, tools, and environment crossings."],["Specify controls","Define allow-lists, approvals, limits, and logging."],["Review the plan","Before implementation and as reality changes."]]},
 {title:"A practical design review",text:"Before enabling an agent, walk these questions in order:",stack:[["1","What behaviour are we trying to guide?"],["2","Whose identity and delegated authority will act?"],["3","What independent controls bound each action?"],["4","What evidence will reconstruct a decision and its effects?"],["5","How does the system fail, escalate, and recover?"]]},
 {title:"Bring it together",text:"Strong AI security does not ask a model to be perfect. It builds an environment where a model’s inevitable mistakes are constrained, attributable, detectable, and recoverable.",quote:"“Many AI security failures come from treating new systems as exceptions to established security practices.”"},
 {type:"final",title:"You completed<br>AI Security and Alignment",text:"Your knowledge-check score: <span class=\"score\" id=\"final-score\"></span>. Carry the core rule forward: behaviour can guide an agent, but identity and controls must bound it—and observability must make it accountable.",source:true}
];
let pos=0,score=0,answers=new Map();
const $=id=>document.getElementById(id);
function glossify(root){
 for(const [term,definition] of Object.entries(terms)){
  const expression=new RegExp(`\\b${term}\\b`,"i");
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:node=>{
   const parent=node.parentElement;
   return parent&&parent.closest("button,a,code,.source,.kicker")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
  }});
  let node;
  while(node=walker.nextNode()){
   const match=expression.exec(node.nodeValue);
   if(!match)continue;
   const matched=node.splitText(match.index);
   const remainder=matched.splitText(match[0].length);
   const punctuation=/^[,.;:!?]/.exec(remainder.nodeValue);
   if(punctuation){
    matched.nodeValue+=punctuation[0];
    remainder.nodeValue=remainder.nodeValue.slice(1);
   }
   const trigger=document.createElement("button");
   trigger.className="term";
   trigger.type="button";
   trigger.dataset.term=term;
   trigger.textContent=matched.nodeValue;
   matched.replaceWith(trigger);
   break;
  }
 }
}
function openDialog(title,body){$("overlay").innerHTML=`<div class="overlay" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><button class="close" type="button">Close</button><h2>${title}</h2><div>${body}</div></section></div>`;$("overlay").querySelector(".close").onclick=()=>{$("overlay").innerHTML=""};$("overlay").querySelector(".overlay").onclick=e=>{if(e.target===e.currentTarget)$("overlay").innerHTML=""}}
function bookKey(s){return s.title||s.question}
function sourceButton(s){return bookExcerptMap[bookKey(s)]?`<button class="learn" type="button" data-more>From the book ↗</button>`:""}
function bookDetail(s){
 const selection=bookExcerptMap[bookKey(s)]?.[0];
 if(!selection)return "";
 const [chapterKey,index]=selection;
 const chapter=chapterKey==="chapter1"?"Chapter 1, “The AI and Security Problem”":"Chapter 2, “Alignment and Authority”";
 return `<p><strong>${chapter}</strong></p><blockquote>${highlightedBookExcerpts[chapterKey][index]}</blockquote>`;
}
function resourceMeta(url){
 const lower=url.toLowerCase();
 if(lower.includes("arxiv.org"))return {type:"Paper",icon:"arXiv"};
 if(lower.includes("youtube.com"))return {type:"Video",icon:"▶"};
 if(lower.includes("github.com"))return {type:lower.includes("/commit/")?"Commit":"Repository",icon:"◉"};
 if(lower.includes("learning.oreilly.com"))return {type:"Book chapter",icon:"▤"};
 if(lower.includes("nist."))return {type:"Standard",icon:"NIST"};
 if(lower.includes("owasp.org"))return {type:"Security guide",icon:"OWASP"};
 if(lower.includes(".pdf"))return {type:"PDF guide",icon:"PDF"};
 if(lower.includes("doi.org"))return {type:"Paper",icon:"DOI"};
 if(lower.includes("alignmentforum.org"))return {type:"Research note",icon:"↗"};
 return {type:"Article",icon:"↗"};
}
function relevantResources(s){
 const labels=slideResources[s.title]||[];
 if(!labels.length)return "";
 return `<div class="resources">${labels.map(label=>{const url=sourceLinkIndex[label],meta=resourceMeta(url);return `<a class="resource-link" href="${url}" target="_blank" rel="noopener noreferrer" aria-label="${meta.type}: ${label}"><span class="resource-icon" aria-hidden="true">${meta.icon}</span><span><small>${meta.type}</small>${label}</span><span aria-hidden="true">↗</span></a>`}).join("")}</div>`;
}
function renderContent(s){
 if(s.type==="quiz"){
  const selected=answers.get(pos);
  const feedback=selected===undefined?"":`<div class="feedback"><strong>${selected===s.answer?"Correct.":"Not quite."}</strong> ${s.explain}</div>`;
 return `<div class="quiz" data-explanation="${encodeURIComponent(s.explain)}">${sourceButton(s)}<p class="kicker">Knowledge check ${s.number}</p><h2>${s.question}</h2><div class="options">${s.options.map((o,i)=>`<button class="option ${selected===undefined?"":i===s.answer?"good":i===selected?"bad":""}" type="button" data-answer="${i}" data-correct="${i===s.answer}" data-slide="${pos}" ${selected===undefined?"":"disabled"}>${o}</button>`).join("")}</div><div data-feedback>${feedback}</div></div>`;
 }
 if(s.type==="intro")return `<div class="intro">${sourceButton(s)}<p class="kicker">Interactive lesson · November 2026</p><h1>${s.title}</h1><p class="lede">${s.text}</p><p class="source">${s.note} <a href="https://learning.oreilly.com/library/view/securing-ai-systems/0642572359133/" target="_blank" rel="noopener">Source ↗</a></p></div>`;
 if(s.type==="final")return `<div class="final">${sourceButton(s)}<p class="kicker">Lesson complete</p><h2>${s.title}</h2><p class="lede">${s.text}</p>${sourceFooter()}</div>`;
 let extra="";
 if(s.bico)extra=`<div class="bico"><div><b>Behaviour</b><p>What it should do.</p></div><div><b>Identity</b><p>Who acts and on whose behalf.</p></div><div><b>Controls</b><p>What it can actually do.</p></div><div><b>Observability</b><p>Evidence of what happened.</p></div></div>`;
 if(s.cards)extra+=`<div class="cards">${s.cards.map(c=>`<div class="card"><strong>${c[0]}</strong><p>${c[1]}</p></div>`).join("")}</div>`;
 if(s.flow)extra+=`<div class="flow">${s.flow.map((x,i)=>`${i?"<i>→</i>":""}<span>${x}</span>`).join("")}</div>`;
 if(s.stack)extra+=`<div class="stack">${s.stack.map(x=>`<div class="step"><b>${x[0]}</b><p>${x[1]}</p></div>`).join("")}</div>`;
 if(s.quote)extra+=`<div class="callout ${s.danger?"danger":""}"><p class="quote">${s.quote}</p></div>`;
 const keyPoints=slidePoints[s.title]||s.points||[];
 const keyPointList=keyPoints.length?`<p class="lens-label">Key points</p><ul class="takeaways">${keyPoints.map(point=>`<li>${point}</li>`).join("")}</ul>`:"";
 return `<p class="kicker">AI security & alignment</p><h2>${s.title}</h2><p class="lede">${s.text}</p>${extra}${keyPointList}${relevantResources(s)}${sourceButton(s)}`;
}
function sourceFooter(){return `<p class="source">Source: <a href="https://learning.oreilly.com/library/view/securing-ai-systems/0642572359133/" target="_blank" rel="noopener">Securing AI Systems</a>, Chapters 1 “The AI and Security Problem” and 2 “Alignment and Authority,” Dan Borges and Campbell, O’Reilly Media. This lesson was produced in November 2026, while the book was in early release.</p><p class="source"><a href="index.html">← Back to AI Lessons</a></p>`}
function render(){
 const s=slides[pos],slide=$("slide");slide.className=`slide ${s.type||""}`;slide.innerHTML=renderContent(s);glossify(slide);
 $("progress").textContent=`${pos+1} / ${slides.length}`;$("bar").style.width=`${((pos+1)/slides.length)*100}%`;$("prev").disabled=pos===0;$("next").textContent=pos===slides.length-1?"Restart ↺":"Next →";
 slide.querySelectorAll(".term").forEach(b=>b.onclick=()=>openDialog(b.textContent,terms[b.dataset.term]));
 const more=slide.querySelector("[data-more]");if(more)more.onclick=()=>openDialog("From the book",bookDetail(s));
 slide.onclick=null;
 if(s.type==="final")$("final-score").textContent=`${score} / ${slides.filter(x=>x.type==="quiz").length}`;
}
function answerQuestion(button){
 if(!button)return;
 const quiz=button.closest(".quiz"),index=Number(button.dataset.slide);
 if(!quiz||quiz.dataset.answered)return;
 const choice=Number(button.dataset.answer),right=button.dataset.correct==="true";
 answers.set(index,choice);
 if(right)score++;
 quiz.querySelectorAll("[data-answer]").forEach(option=>{
  option.disabled=true;
  if(option.dataset.correct==="true")option.classList.add("good");
  else if(option===button)option.classList.add("bad");
 });
 quiz.querySelector("[data-feedback]").innerHTML=`<div class="feedback"><strong>${right?"Correct.":"Not quite."}</strong> ${decodeURIComponent(quiz.dataset.explanation)}</div>`;
 quiz.dataset.answered="true";
 quiz.closest(".slide").scrollTop=0;
}
window.answerQuestion=answerQuestion;
$("prev").onclick=()=>{pos=Math.max(0,pos-1);render()};$("next").onclick=()=>{if(pos===slides.length-1){pos=0;score=0;answers.clear()}else pos++;render()};$("theme").onclick=()=>{const dark=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=dark?"":"dark";$("theme").textContent=dark?"Dark mode":"Light mode"};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click();if(e.key==="Escape")$("overlay").innerHTML=""});render();
document.addEventListener("click",event=>{const link=event.target.closest('a[target="_blank"]');if(link){event.preventDefault();window.open(link.href,"_blank","noopener,noreferrer")}});
document.addEventListener("click",event=>{const button=event.target.closest?.("[data-answer]");if(button){event.preventDefault();answerQuestion(button)}},true);
</script>
