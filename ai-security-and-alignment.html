<script>
const terms={
 "alignment":"Techniques that shape the likelihood of a model’s responses during training or prompting. They do not enforce permissions at runtime.",
 "authority":"The permissions a system has been granted to take action in the real world.",
 "least privilege":"Giving an identity only the minimum permissions required for its specific task, for only as long as needed.",
 "prompt injection":"Untrusted instructions embedded in content that influence a model away from its intended task.",
 "defense in depth":"Independent, overlapping safeguards so one control’s failure does not become a total failure.",
 "observability":"Evidence that lets a team understand activity, identities, policy decisions, and effects during or after execution.",
 "zero trust":"A security approach that continuously verifies identity and authorization rather than assuming a trusted network location.",
 "control decay":"The gradual weakening of a security control as systems, requirements, and exceptions change around it.",
 "data exfiltration":"Sending sensitive information outside the intended trust boundary.",
 "red teaming":"Proactively looking for ways a system can be abused or fail before an attacker finds them."
};

 ["CrowdStrike: Principle of Least Privilege","https://www.crowdstrike.com/en-us/cybersecurity-101/identity-protection/principle-of-least-privilege-polp"],

 ["Cybersecurity Tradecraft materials","https://github.com/ahhh/Cybersecurity-Tradecraft/tree/main/Chapter4"],
 ["Centralized logging explainer","https://www.splunk.com/en_us/blog/learn/centralized-logging.html"],

 ["Constitutional AI","https://arxiv.org/abs/2212.08073"],

 ["Direct Preference Optimization","https://arxiv.org/abs/2305.18290"],

 ["AI safety research","https://arxiv.org/abs/2601.14582"],

const highlightedBookExcerpts={
 chapter1:[
  `I want to introduce a mental model we will use throughout this book for reasoning about agentic systems in production: Behaviour, Identity, Controls, and Observability, or BICO. When looking at an AI system, this mental model gives us a surprisingly effective way to pull apart what the system is supposed to do from what it is actually capable of doing, while preserving enough evidence to understand what happened afterward. Concepts like identity and observability also help us trace an agent’s actions throughout its lifecycle and understand their downstream effects.`,
  `Controls are the hard technical restrictions that exist within the environment that constrain the system from acting in unexpected ways. Controls should exist outside the model’s own decision-making influence and independently constrain what is possible. Filesystem permissions, network egress restrictions, API gateways, sandboxing, rate limits, approval workflows, scoped tools, transaction limits, and policy validation are all examples. A prompt saying don’t send data to the Internet is behaviour. A network policy preventing the process from reaching the Internet is a control.`,
  `The prompt is really just a guiding mechanism for the program execution, it shouldn’t be the security boundary or enforce permissions. I’ll repeat that for emphasis: the prompt is not a security boundary and should not be treated as a decider for access controls. While prompts and plans can describe the intended constraints and outcomes, they can’t guarantee adherence as we’ve already seen. They are simply a behaviour guide. In this sense, “security through prompt conditions” is analogous to “security through obscurity”, in that it provides a false sense of control without real enforcement.`,
  `The key distinction is that more context is not the same thing as better context. A large window is only useful when the model can reliably find, prioritize, and reuse what matters. Without structure, large prompts become a messy dumping ground of notes, instructions, examples, and partial outputs. The result is often a weaker signal-to-noise ratio when compared to well reasoned responses. That is why context engineering matters more about structure than context length alone.`,
  `One of the most effective ways to improve the resilience of AI systems is to red team your own solutions. Instead of waiting for real attackers to discover weaknesses, proactively attempt to uncover failure cases before they occur. The goal here is to understand the various ways the application could fail or be abused though different attacks or use cases. By exploring these scenarios early, teams can design controls, guardrails, and monitoring strategies that reduce the likelihood of those events becoming real incidents.`,
  `The trifecta describes a situation in which an AI system simultaneously has access to private or sensitive data, is exposed to untrusted or attacker-controlled content, and possesses the ability to communicate externally in ways that could transmit that data outside the system. When these three conditions coexist, an attacker may be able to manipulate the model through crafted inputs and ultimately extract sensitive information.`,
  `Security controls lose effectiveness over time unless continuously tested, updated, and challenged. In applying that to the above example, the right move would have been to deconstruct the ever-expanding network firewall rule, into specific service or host roles, making each one tight and explicit to the service it is controlling. One of the reasons we lay this principle out is a lot of automation work tends to be set-and-forget, but time has shown that all things decay, even technology.`,
  `Planning in security can’t be overstated. In large corporate environments, engineering and security teams often push for design documents, or a formal way to discuss the plans and implementation of a project in a technically rigorous way. This is similar to the way several engineering teams will meet to discuss the master blueprint on large building projects. Depending on the situation plans and controls may be subject to various regulatory frameworks, so why not factor those into the planning stage early.`
 ],
 chapter2:[
  `Alignment operates at a specific layer of the system. It shapes the model’s behavior during training and fine-tuning. AI security, on the other hand, operates at the systems layer and governs what the model is allowed to access and execute once deployed. There is overlap, specifically as models are being used more frequently in cybersecurity domains, but the goals and enforcement mechanisms are different. Alignment influences model behavior, while security constrains identity and control.`,
  `Behavior shaping can be performed during pre-training and post-training, both of which induce opportunities for security risk. Pretraining attacks include data poisoning and backdoors, while post-training attacks can include a much more broad attack vector such as fine-tuning jailbreaks, reward hacking, and preference data poisoning. Specialized attack vectors show up in reasoning models like reward specific gaming and unfaithful chain-of-thought attacks. We’ll cover deployment attacks in later chapters.`,
  `While none of these techniques enforce behavior, they all meaningfully lower risk in the common cases, and that’s precisely why people overtrust it. These techniques only make certain outcomes more or less likely. Keep that distinction in mind as we go.`,
  `Behavior shaping isn’t free. Every alignment technique introduces tradeoffs, and the usual framing is the alignment tax or the capability you give up to get the safety you want. Pushing too hard on harmlessness and you cost yourself in helpfulness. Push hard on safety and your dull capability. You are tuning behavior along a set of axes and moving on tends to move the others. What you are not doing is enforcing correctness, because that just isn’t an axis we can enforce in the model distribution.`,
  `Alignment can influence whether a model proposes an action, but it does not determine whether that action is carried out. In isolation, alignment looks like control, but the system actually decides what happens on disk, over the network, or across your infrastructure. Control requires deterministic enforcement, and that lives in the surrounding system. The moment a model is given access to tools, data, or execution environments, the problem shifts from behavior to authority.`,
  `Authority is the permissions granted to a system to take action for business purposes. These permissions come from humans and software alike, but the consequences are the same. When authority is misaligned with execution, actions happen within the system with unintended consequences.`,
  `Agents can be on their best behavior, fully following alignment protocols and not impacting a signal content policy violation to create a real world impact. Agentic workflows grant a model access to tools, memory, and the ability to take sequential action towards a real world goal. The models reason across steps, make decisions, and then take action. Which is exactly where the problem emerges.`,
  `Access is often granted broadly because scoping it narrowly is difficult and slows things down. The agent works, and it works well, so more access is granted. More tools are introduced. More responsibility follows. Confidence builds over time. Sound familiar? Alignment won’t prevent this class of failure, because it was never designed to. What we’re seeing isn’t alignment problems. They’re authority and control problems.`
 ]
};
let knowledgeCheckNumber=0;
const q=(question,options,answer,explain)=>({type:"quiz",number:++knowledgeCheckNumber,question:question.replace(/^Knowledge check \d+:\s*/i,""),options,answer,explain});
const slides=[
 {type:"intro",title:"AI Security<br>and Alignment",text:"A 1–2 hour interactive lesson on shaping model behavior, limiting real-world authority, and building agentic systems that can withstand failure.",note:"Based on Chapters 1–2 of <em>Securing AI Systems</em> by Dan Borges and Campbell, in early release when this lesson was produced."},
 {title:"How to use this lesson",text:"Move through 50 short, full-page slides. Tap dotted terms for definitions. Open “From the book” for brief source excerpts and context. Knowledge checks are distributed through the lesson.",cards:[["Aim","Connect AI alignment vocabulary to practical security controls."],["Mindset","Assume models sometimes deviate; make the damage bounded and traceable."],["Outcome","Design behavior, identity, controls, and observability as one system."]]},
 {title:"The central distinction",text:"<strong>Alignment influences generation. Systems govern execution.</strong> A model can be polite, helpful, and well-aligned while the surrounding application still gives it unsafe authority.",quote:"“Alignment influences model behavior, while security constrains identity and control.”",more:"Alignment operates at a specific layer: it shapes behavior during training and fine-tuning. AI security operates at the systems layer, governing what the model may access and execute after deployment."},
 {title:"Why this matters now",text:"Agentic systems do more than answer questions. They retrieve documents, invoke APIs, write files, create sub-agents, and alter production resources. That moves risk from text into the environment.",cards:[["Model behavior","Probabilistic and sometimes surprising."],["Tool use","Can create durable external effects."],["Security engineering","Must make unsafe effects impossible or difficult."]]},
 {title:"A security lens built from history",text:"AI changes implementation details, but many underlying problems are familiar: untrusted input, excess privilege, weak boundaries, missing logs, and single points of failure.",more:"The book frames traditional principles such as least privilege, input validation, and defense in depth as durable abstractions that apply across generations of technology."},
 q("Knowledge check 1: Which statement best captures the relationship between alignment and security?",["Alignment replaces access control when a model refuses bad requests.","Alignment shapes likely outputs; security systems enforce what actions can happen.","Security only matters for models that are not aligned.","Alignment is the same thing as authentication."],1,"Alignment changes probabilities. Identity, permissions, policy checks, and controls determine what can actually occur."),
 {title:"Meet BICO",text:"A production-agent mental model: <strong>Behaviour, Identity, Controls, and Observability.</strong> It separates what the system is meant to do from what it is actually permitted to do—and preserves evidence.",bico:true},
 {title:"B: Behaviour",text:"Behaviour is the intended response or action: prompts, plans, training, fine-tuning, guardrails, and evaluations. It is useful guidance—but never a hard boundary.",quote:"“Security through text, fails under stress.”",more:"The source is explicit: if a security model depends entirely on the AI deciding to behave itself, it is not truly a security model."},
 {title:"I: Identity",text:"Identity answers: <strong>Who is acting? What may it do? On whose behalf?</strong> In agentic systems, the agent, calling user, service, and delegated authority may all differ.",flow:["Authentication (AuthN)","Authorization (AuthZ)","Delegation","Action"]},
 {title:"C: Controls",text:"Controls are technical restrictions outside the model’s decision-making influence. They constrain what is possible even when behavior goes wrong.",cards:[["Behavior","“Do not send data to the Internet.”"],["Control","A network policy prevents the process from reaching the Internet."],["Design test","Could the model bypass this using only its own output? If yes, it is not a sufficient control."]]},
 {title:"O: Observability",text:"Logs must follow an action beyond model text: delegation, authorization, tools, policy decisions, APIs, resources, and effects. A SIEM can correlate this evidence.",more:"A useful trace shows the workload, initiating user, agent identity, delegated authority, policy decision, target resources, and time—not only what the model said."},
 q("Knowledge check 2: A prompt tells an agent not to upload a report. Which addition is a control?",["A stronger version of the same prompt","A model evaluation that rewards refusals","Network egress policy that blocks the upload destination","A dashboard showing the upload happened"],2,"The network policy constrains capability independently of the model. The dashboard is observability, and the others shape behavior."),
 {title:"BICO as a failure plan",text:"When behavior fails, identity should attribute the failure, controls should limit impact, and observability should show what occurred. The aim is not perfect model behavior; it is bounded failure.",quote:"“Security is behaviour anchored in identity, bounded by controls, and made traceable through observability.”"},
 {title:"Probabilistic by design",text:"LLMs are not deterministic functions. Identical input can yield different outputs because of sampling, floating-point effects, and other inference behavior. Build determinism around the model.",cards:[["Do not assume","A passing test proves all future behavior."],["Do enforce","Deterministic checks at the action boundary."],["Do expect","Some variance in reasoning and output."]]},
 {title:"The prompt is not a permission system",text:"Prompts can document intent and guide a model, much like source material guides a program. They cannot reliably authorize an action, revoke a credential, or enforce a boundary.",more:"The source compares relying on prompt conditions to security through obscurity: both can create a false sense of enforcement when no hard control exists."},
 {title:"Prompt traceability is still valuable",text:"Version prompts and plans like source code. Trace them to sessions, outputs, and changes. This supports debugging, reproducibility, incident response, and accountability—but protect the trace itself.",cards:[["Store","Prompts, plans, model configuration, and key outputs."],["Review","Prompt libraries and shared skills as supply-chain artifacts."],["Protect","Secrets and sensitive context must not leak into logs."]]},
 q("Knowledge check 3: Why should a reusable prompt library be reviewed like a software supply-chain component?",["Prompts make models deterministic.","Prompts may contain manipulated instructions or unsafe assumptions that influence connected systems.","Prompt files always contain executable binaries.","Reviewing prompts eliminates prompt injection."],1,"Prompts are interpreted input that can influence connected tools and workflows. Review reduces risk; it does not turn them into a security boundary."),
 {title:"Context is working memory—not a vault",text:"Bigger context windows do not automatically yield better reasoning. Important instructions can be buried in noisy, long inputs. Structure and relevance matter more than raw size.",cards:[["Curate","Use only task-relevant context."],["Externalize","Keep a durable, reviewable plan or memory artifact."],["Summarize","Record verified work, assumptions, failures, and next steps."]]},
 {title:"Artifact-driven workflows",text:"A plan, execution log, and reviewed summaries give an agent stable anchors. They also create natural human checkpoints and a recoverable handoff between stages or agents.",more:"The chapter describes summaries as a way to simulate continuity in an inherently stateless architecture, while preserving a reviewable record of what mattered."},
 {title:"Verify before trust",text:"Treat AI-generated code as untrusted until a human reviews it. Keep changes small, use branches, and make tests, linting, dependency checks, and secrets detection part of the harness.",quote:"AI-assisted code is AI-generated code that a human has reviewed and/or edited.",more:"The book advocates a staged, plan-driven approach: approve an architecture, introduce small features, and review each branch before it lands."},
 q("Knowledge check 4: Which setup best preserves independence between AI-generated implementation and validation?",["Have the same agent generate both code and tests in its working directory.","Use tests written or reviewed independently and execute them out of the agent’s direct control.","Ask the model to promise it did not alter the tests.","Only run tests after a production deployment."],1,"Independent tests and an out-of-band CI boundary make it harder for an agent to optimize the validator rather than the intended behavior."),
 {title:"Human-in-the-loop (HITL)",text:"Human review is a runtime control when an agent’s action is high impact or irreversible. It is not merely a speed bump: it is an approval boundary with an accountable decision-maker.",cards:[["Usually low risk","Drafting a private summary."],["Often high risk","Database change, deployment, external send, confidential record access."],["Escalate","Based on impact, irreversibility, data sensitivity, and authority."]]},
 {title:"Tiered autonomy",text:"Allow independent operation for bounded, low-risk work. Require approval for higher-risk actions. This preserves automation where it helps without normalizing broad, standing authority.",more:"Human feedback improves prompts, policies, and controls over time. That makes HITL both a safeguard and a learning loop."},
 {title:"Tool use changes the problem",text:"A model’s natural-language answer is one thing. An agent that can call a shell, payment API, production database, or outbound email system is operating with authority.",quote:"“The problem shifts from behavior to authority.”"},
 {title:"Separation of duties",text:"Make the agentic component focused and narrow. Small purpose-built agents and tools are easier to identity-map, test, scope, and constrain. Split major duties across explicit boundaries.",flow:["Research agent","Reviewed result","Scoped execution tool","Audited change"]},
 q("Knowledge check 5: What is the primary security benefit of separating a broad agent into focused tools?",["It guarantees the model will not hallucinate.","It reduces the blast radius and makes identities and permissions easier to scope.","It removes the need to log actions.","It lets every tool share one powerful credential."],1,"Focused components allow narrow identities, scoped authority, independent tests, and clearer trust boundaries."),
 {title:"Start locked down, then pivot",text:"Begin with default-deny. Enable each capability deliberately as the system proves it needs it. This makes permission growth visible and forces an explicit design decision.",flow:["Default deny","Incremental enablement","Continuous audit"]},
 {title:"ALARA: structured agents",text:"The chapter introduces <strong>As Low as Reasonably Achievable</strong> as a project structure that explicitly scopes context, agents, tools, workflows, data, and model configuration.",cards:[["Context files","Guide intended behavior."],["Agent definitions","Give each role clear responsibilities."],["Tool definitions","Make allowable actions explicit."],["Workflows","Separate orchestration from execution."]]},
 {title:"What structured scoping buys you",text:"Strict tool scoping and modular roles can improve safety <em>and</em> performance. Fewer irrelevant tools and less context reduce overload, coordination breakdowns, and accidental capability.",more:"The cited ALARA evaluation reports improvements across local-model tasks when agents use structured organization, minimal context, and tighter tool access."},
 {title:"Threat modeling: play devil’s advocate",text:"Assume a system can fail or be abused. Ask how an attacker, a confused user, a compromised account, an unavailable service, or an unexpected interaction could change outcomes.",cards:[["Assets","What data, money, systems, and trust matter?"],["Actors","Who could influence or misuse the system?"],["Paths","Where does input enter, authority change, or data leave?"],["Impact","What happens if each path succeeds?"]]},
 q("Knowledge check 6: Which question belongs earliest in a threat-modeling exercise?",["Which model vendor has the most marketing material?","How could an attacker or ordinary user influence this workflow in an unintended way?","How can we remove all logs to reduce storage cost?","How can we grant the agent administrator rights faster?"],1,"Threat modeling begins by challenging assumptions and exploring unintended paths, not by assuming intended behavior."),
 {title:"Risk needs two dimensions",text:"A practical starting point is <strong>risk = impact × likelihood.</strong> An unlikely catastrophe and a common nuisance may both deserve attention—but for different reasons.",cards:[["Likelihood","How plausible is the event in this deployment?"],["Impact","What would it cost: data, money, safety, availability, trust?"],["Prioritize","Address material combinations first; document residual risk."]]},
 {title:"Red team before attackers do",text:"Red teaming exercises prompts, tools, policies, and workflows against plausible misuse. A tabletop exercise can expose gaps in communication, controls, logs, and incident response without a live incident.",more:"The source emphasizes both malicious and non-malicious failures: design defects, operational mistakes, and unexpected component interactions often produce the most common scenarios."},
 {title:"The Lethal Trifecta",text:"A useful shortcut for agent risk. Elevated concern appears when all three conditions coexist:",cards:[["1. Private data","The agent can retrieve sensitive information."],["2. Untrusted input","Attacker-controlled content reaches the model."],["3. External communication","The system can transmit information beyond its boundary."]],more:"Simon Willison’s Lethal Trifecta is a threat-modeling heuristic, not a claim that every such system is inevitably compromised."},
 q("Knowledge check 7: Which change most directly breaks the Lethal Trifecta for a document-reading agent?",["Give it a more persuasive system prompt.","Remove or tightly gate its ability to send retrieved data to external destinations.","Increase the context window.","Ask users to be trustworthy."],1,"Removing or strongly gating an exfiltration path eliminates one of the three preconditions. You should still address the other risks."),
 {title:"Untrusted input is everywhere",text:"Treat external input as potentially malicious until validated in context. For agents, that includes files, web pages, retrieved documents, emails, memory, summaries, tool output, and agent-to-agent messages.",quote:"“Treat all external input as potentially malicious until validated within the intended context.”"},
 {title:"Prompt injection is a systems problem",text:"Injection is not solved simply by asking the model to ignore malicious text. Instead, isolate model reasoning from execution and use deterministic controls around actions the model proposes.",flow:["Untrusted content","Model interpretation","Proposed action","Policy validation","Scoped tool execution"]},
 {title:"Access controls at boundaries",text:"Every crossing where assumptions change is a <strong>trust boundary</strong>: user to service, service to API, agent to tool, environment to network, or one delegated identity to another. Verify identity and authorization at each one.",more:"The book’s principle: “Access decisions should require verified identity and explicit authorization before actions are permitted.”"},
 q("Knowledge check 8: An agent calls a payroll API on behalf of an employee. What should the service verify?",["Only that the model produced grammatically correct JSON.","The agent identity, the employee’s delegated authority, and authorization for the requested action.","That the agent’s system prompt says it is trustworthy.","Only the employee’s network location."],1,"Identity and delegation establish who is acting and on whose authority; authorization determines whether that action is allowed."),
 {title:"Control decay is real",text:"Controls weaken as exceptions accumulate, integrations change, and teams modify old rules. A firewall can still exist while becoming broadly permissive. Controls require recurring tests and redesign.",quote:"“Security controls lose effectiveness over time unless continuously tested, updated, and challenged.”"},
 {title:"Defense in depth",text:"Assume one control will fail. Layer independent safeguards so a failure in prompts, policy, identity, network, approval, or detection does not create total compromise.",cards:[["Prevent","Least privilege, sandboxing, allow-lists."],["Constrain","Transaction limits, scoped tools, egress controls."],["Detect","Correlated logs and anomaly monitoring."],["Respond","Revocation, approval, rollback, incident playbooks."]]},
 {title:"Least privilege for agents",text:"Give every component the smallest authority necessary for a specific task and duration. Prefer task-scoped, short-lived credentials over a standing administrator token in context.",more:"The chapter connects over-privileged agents to oversized attack surfaces, wider error impact, and privilege escalation—especially troubling for probabilistic systems."},
 q("Knowledge check 9: Which credential design follows least privilege?",["One permanent production-admin key shared by every agent.","A time-limited token permitting only the single approved record update.","A hidden token in the system prompt.","A token with every permission except one dangerous API."],1,"The narrow, short-lived token limits both what an agent can do and the duration of a possible misuse."),
 {title:"Supply-chain risk includes AI output",text:"Models can hallucinate dependency names. Attackers can register those names and catch automated installations—an emerging pattern called <strong>slopsquatting</strong>. Treat generated dependencies as untrusted suggestions.",cards:[["Verify","Names, publishers, versions, licenses, and integrity."],["Scan","Dependencies, code, configurations, and secrets."],["Constrain","Use allow-lists and locked manifests where appropriate."]]},
 {title:"Monitor what you cannot control",text:"Some risks cannot be prevented immediately. Centralized, normalized telemetry lets teams detect anomalous behavior, investigate incidents, and understand whether controls are still working.",quote:"“You cannot secure behaviors you cannot observe.”",more:"Instrumentation should record critical interactions and security functions, especially when an action crosses a security boundary."},
 {title:"Fail securely",text:"Failure is inevitable. A failure should reduce capability rather than accidentally broaden it. Design explicit degraded modes: deny, require extra verification, queue for review, or use a narrow alternate path.",cards:[["Fail open","May be correct for life safety, but can expose a security boundary."],["Fail closed","Usually safer for authorization and sensitive action."],["Resilient design","Use a deliberate secondary path, not an accidental bypass."]]},
 q("Knowledge check 10: A policy service is unavailable just before an agent sends a customer export. What is the safest default?",["Send it anyway so the workflow remains reliable.","Retry forever with the same broad credential.","Fail closed: withhold the export and surface an explicit review or recovery path.","Ask the model whether the export is probably safe."],2,"When authorization cannot be evaluated, capability should not silently expand. A controlled recovery path preserves both safety and operability."),
 {title:"Planning is a security control",text:"Planning clarifies architecture, trust boundaries, ownership, controls, tests, and residual risk <em>before</em> an agent has authority. It is a NIST SP 800-53 control family for a reason.",cards:[["Name an owner","A person accepts decisions and residual risk."],["Design boundaries","Map identity, data, tools, and environment crossings."],["Specify controls","Define allow-lists, approvals, limits, and logging."],["Review the plan","Before implementation and as reality changes."]]},
 {title:"A practical design review",text:"Before enabling an agent, walk these questions in order:",stack:[["1","What behavior are we trying to guide?"],["2","Whose identity and delegated authority will act?"],["3","What independent controls bound each action?"],["4","What evidence will reconstruct a decision and its effects?"],["5","How does the system fail, escalate, and recover?"]]},
 {title:"Bring it together",text:"Strong AI security does not ask a model to be perfect. It builds an environment where a model’s inevitable mistakes are constrained, attributable, detectable, and recoverable.",quote:"“Many AI security failures come from treating new systems as exceptions to established security practices.”"},
 {type:"final",title:"You completed<br>AI Security and Alignment",text:"Your knowledge-check score: <span class=\"score\" id=\"final-score\"></span>. Carry the core rule forward: behavior can guide an agent, but identity and controls must bound it—and observability must make it accountable.",source:true}
];
let pos=0,score=0,answered=new Set();
const $=id=>document.getElementById(id);
function glossify(root){
 for(const [term,definition] of Object.entries(terms)){
  const expression=new RegExp(`\\b${term}\\b`,"i");
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:node=>{
   const parent=node.parentElement;
   return parent&&parent.closest("button,a,code,.source,.kicker")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
  }});
  let node;
  while(node=walker.nextNode()){
   const match=expression.exec(node.nodeValue);
   if(!match)continue;
   const matched=node.splitText(match.index);
   matched.splitText(match[0].length);
   const trigger=document.createElement("button");
   trigger.className="term";
   trigger.type="button";
   trigger.dataset.term=term;
   trigger.textContent=matched.nodeValue;
   matched.replaceWith(trigger);
   break;
  }
 }
}
function openDialog(title,body){$("overlay").innerHTML=`<div class="overlay" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><button class="close" type="button">Close</button><h2>${title}</h2><div>${body}</div></section></div>`;$("overlay").querySelector(".close").onclick=()=>{$("overlay").innerHTML=""};$("overlay").querySelector(".overlay").onclick=e=>{if(e.target===e.currentTarget)$("overlay").innerHTML=""}}
function sourceButton(s){return `<button class="learn" type="button" data-more>From the book ↗</button>`}
function bookDetail(s){
 const context=s.more||"This lesson connects the chapter’s security principle to a practical agentic-system design decision.";
 const chapterKey=pos<24?"chapter1":"chapter2";
 const chapter=chapterKey==="chapter1"?"Chapter 1, “The AI and Security Problem”":"Chapter 2, “Alignment and Authority”";
 const excerpt=highlightedBookExcerpts[chapterKey][pos%highlightedBookExcerpts[chapterKey].length];
 return `<p><strong>${chapter}</strong></p><p>${context}</p><p><strong>Highlighted source extract.</strong></p><blockquote>${excerpt}</blockquote><p><strong>Source context.</strong> The book emphasizes that probabilistic models require deterministic enforcement around the actions they can take. Its recommended approach is to combine behavioral guidance with narrowly scoped identity, independent controls, and end-to-end evidence for investigation.</p><p><strong>Apply it.</strong> Treat this as a design prompt: identify the trust boundary, name the identity and delegated authority, define the hard control, then decide what telemetry proves the control worked.</p>`;
}
function exploreMore(){return `<div class="cards">${sourceLinks.map(([label,url])=>`<div class="card"><strong>${label}</strong><p><a href="${url}" target="_blank" rel="noopener noreferrer">Explore more ↗</a></p></div>`).join("")}</div>`}
function bookFooter(){return `<p class="source-mini">Based on <a href="https://learning.oreilly.com/library/view/securing-ai-systems/0642572359133/" target="_blank" rel="noopener">Securing AI Systems</a>, Chapters 1–2, Dan Borges and Campbell, O’Reilly Media. Produced 12 November 2026 while the book was in early release. <button class="term" type="button" data-explore>Explore more ↗</button></p>`}
function renderContent(s){
 if(s.type==="quiz")return `<div class="quiz"><p class="kicker">Knowledge check ${s.number}</p><h2>${s.question}</h2><div class="options">${s.options.map((o,i)=>`<button class="option" type="button" data-answer="${i}" ${answered.has(pos)?"disabled":""}>${o}</button>`).join("")}</div><div id="feedback"></div></div>`;
 if(s.type==="intro")return `<div class="intro"><p class="kicker">Interactive lesson · 12 November 2026</p><h1>${s.title}</h1><p class="lede">${s.text}</p><p class="source">${s.note}</p></div>`;
 if(s.type==="final")return `<div class="final"><p class="kicker">Lesson complete</p><h2>${s.title}</h2><p class="lede">${s.text}</p>${sourceFooter()}</div>`;
 let extra="";
 if(s.bico)extra=`<div class="bico"><div><b>Behaviour</b><p>What it should do.</p></div><div><b>Identity</b><p>Who acts and on whose behalf.</p></div><div><b>Controls</b><p>What it can actually do.</p></div><div><b>Observability</b><p>Evidence of what happened.</p></div></div>`;
 if(s.cards)extra+=`<div class="cards">${s.cards.map(c=>`<div class="card"><strong>${c[0]}</strong><p>${c[1]}</p></div>`).join("")}</div>`;
 if(s.flow)extra+=`<div class="flow">${s.flow.map((x,i)=>`${i?"<i>→</i>":""}<span>${x}</span>`).join("")}</div>`;
 if(s.stack)extra+=`<div class="stack">${s.stack.map(x=>`<div class="step"><b>${x[0]}</b><p>${x[1]}</p></div>`).join("")}</div>`;
 if(s.quote)extra+=`<div class="callout ${s.danger?"danger":""}"><p class="quote">${s.quote}</p></div>`;
 const takeaways=s.points||["Name the boundary where this decision matters.","Use a hard control rather than trusting model intent.","Keep evidence that explains the resulting action."];
 const takeawayList=!s.bico&&!s.cards&&!s.flow&&!s.stack?`<ul class="takeaways">${takeaways.map(point=>`<li>${point}</li>`).join("")}</ul>`:"";
 return `<p class="kicker">AI security & alignment</p><h2>${s.title}</h2><p class="lede">${s.text}</p>${extra}${takeawayList}${sourceButton(s)}`;
}
function sourceFooter(){return `<p class="source">Source: <a href="https://learning.oreilly.com/library/view/securing-ai-systems/0642572359133/" target="_blank" rel="noopener">Securing AI Systems</a>, Chapters 1 “The AI and Security Problem” and 2 “Alignment and Authority,” Dan Borges and Campbell, O’Reilly Media. This lesson was produced 12 November 2026, while the book was in early release.</p><p class="source"><a href="index.html">← Back to AI Lessons</a></p>`}
function render(){
 const s=slides[pos],slide=$("slide");slide.className=`slide ${s.type||""}`;slide.innerHTML=renderContent(s)+(s.type==="final"?"":bookFooter());glossify(slide);
 $("progress").textContent=`${pos+1} / ${slides.length}`;$("bar").style.width=`${((pos+1)/slides.length)*100}%`;$("prev").disabled=pos===0;$("next").textContent=pos===slides.length-1?"Restart ↺":"Next →";
 slide.querySelectorAll(".term").forEach(b=>b.onclick=()=>openDialog(b.textContent,terms[b.dataset.term]));
 const more=slide.querySelector("[data-more]");if(more)more.onclick=()=>openDialog("From the book",bookDetail(s));
 const explore=slide.querySelector("[data-explore]");if(explore)explore.onclick=()=>openDialog("Explore more",`<p class="mini">External resources linked in the supplied chapters.</p>${exploreMore()}`);
 slide.onclick=event=>{const option=event.target.closest("[data-answer]");if(option)answer(+option.dataset.answer,s)};
 if(s.type==="final")$("final-score").textContent=`${score} / ${slides.filter(x=>x.type==="quiz").length}`;
}
function answer(choice,s){if(answered.has(pos))return;answered.add(pos);const right=choice===s.answer;if(right)score++;document.querySelectorAll("[data-answer]").forEach(b=>{const n=+b.dataset.answer;b.disabled=true;b.classList.add(n===s.answer?"good":n===choice?"bad":"")});$("feedback").innerHTML=`<div class="feedback"><strong>${right?"Correct.":"Not quite."}</strong> ${s.explain}</div>`}
$("prev").onclick=()=>{pos=Math.max(0,pos-1);render()};$("next").onclick=()=>{if(pos===slides.length-1){pos=0;score=0;answered.clear()}else pos++;render()};$("theme").onclick=()=>{const dark=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=dark?"":"dark";$("theme").textContent=dark?"Dark mode":"Light mode"};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click();if(e.key==="Escape")$("overlay").innerHTML=""});render();
</script>
